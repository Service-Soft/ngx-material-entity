<!-- eslint-disable angular/cyclomatic-complexity -->
<!-- eslint-disable angular/no-call-expression -->
@if (!isLoaded && data.displayLoadingSpinner) {
    <div class="page-container">
        <br>
        <mat-spinner></mat-spinner>
        <br>
    </div>
}

@if (isLoaded) {
    <div class="page-container">
        <br>
    
        <!------------>
        <!-- Header -->
        <!------------>
        <div class="header">
            <div class="cancel-container">
                <button type="button" mat-raised-button class="back-button" tabindex="-1" [class.unsavedChanges]="hasUnsavedChanges" (click)="navigateBack()">
                    <fa-icon [icon]="faChevronLeft"></fa-icon>
                    {{data.editData.cancelButtonLabel}}
                    @if (hasUnsavedChanges) {
                        <fa-icon style="color: orange;" [icon]="faWarning"></fa-icon>
                    }
                </button>
            </div>
            <div class="actions-container">
                @if (data.editData.actions.length) {
                    <button type="button" mat-raised-button [matMenuTriggerFor]="menu">
                        {{data.editData.actionsLabel}}
                    </button>
                }
                <mat-menu #menu="matMenu">
                    @for (action of data.editData.actions; track $index) {
                        <button type="button" mat-menu-item [disabled]="editActionDisabled(action)" (click)="runEditAction(action)">
                            {{action.displayName}}
                        </button>
                    }
                </mat-menu>
            
                @if (allowDelete) {
                    <button type="button" mat-raised-button color="warn" class="delete-button" tabindex="-1" (click)="delete()">
                        {{data.editData.deleteButtonLabel}}
                    </button>
                }
            </div>
        </div>
    
        <h1>{{data.editData.title(entityPriorChanges)}}</h1>
    
        <!----------->
        <!-- Input -->
        <!----------->
        <form (ngSubmit)="edit()">
            <ngx-mat-entity-form [hideOmitForEdit]="true" [isEntityReadOnly]="isEntityReadOnly" [entity]="entity" (selectedTabChange)="checkOffset()" (formChange)="checkEntity()">
            </ngx-mat-entity-form>
    
            <div class="bottom-row-container">
                <div class="bottom-row container">
                    <button type="submit" mat-raised-button matBadgeColor="warn"
                        [class.badge-changes]="!validationErrors.length"
                        [disabled]="isEntityReadOnly || !isEntityValid || !isEntityDirty"
                        [matBadge]="validationErrors.length > 0 ? validationErrors.length : changes.length"
                        [matBadgeHidden]="!validationErrors.length && !changes.length"
                    >
                        {{data.editData.confirmButtonLabel}}
                    </button>
                    @if (validationErrors.length || changes.length) {
                        <ngx-mat-entity-tooltip [tooltipContent]="tooltipContent"></ngx-mat-entity-tooltip>
                    }
                </div>
            </div>
        </form>
        <br>
    </div>
}
